<div class="ab-site ab-admin" id="ab-site" data-theme="light" style="{plhd_style}">
<header class="ab-ahead">
    <button type="button" class="ab-ibtn ab-burger" aria-label="Menu" onclick="AdminBoardJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ab-abrand" href="Admin"><svg class="ab-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--ab-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--ab-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="ab-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="ab-grow"></span>
    <span class="ab-demo" id="ab-demo"></span>
    <a class="ab-who" id="ab-who" href="AdminAccount"></a>
    <a class="ab-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ab-out" onclick="AdminBoardJs.signOut()">Sign out</button>
</header>
<aside class="ab-side" id="ab-nav" aria-label="Admin">
    <div class="ab-nav-top"><span>Menu</span><button type="button" class="ab-ibtn" aria-label="Close" onclick="AdminBoardJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ab-amenu" id="ab-menu"></ul>
</aside>
<div class="ab-scrim" id="ab-scrim" onclick="AdminBoardJs.closeNav()"></div>
<main class="ab-amain" id="ab-main"><p class="ab-loading">Loading&hellip;</p></main>
<div class="ab-modal" id="ab-modal" onclick="if(event.target===this)AdminBoardJs.closeModal()">
    <div class="ab-mbox" role="dialog" aria-modal="true"><button type="button" class="ab-ibtn ab-mclose" aria-label="Close" onclick="AdminBoardJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ab-mbody"></div></div>
</div>
<div class="ab-toast" id="ab-toast" role="status" aria-live="polite"></div>
</div>
