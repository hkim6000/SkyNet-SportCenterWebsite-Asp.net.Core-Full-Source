<div class="ai-site ai-admin" id="ai-site" data-theme="light" style="{plhd_style}">
<header class="ai-ahead">
    <button type="button" class="ai-ibtn ai-burger" aria-label="Menu" onclick="AdminInstructorsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ai-abrand" href="Admin"><svg class="ai-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--ai-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--ai-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="ai-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="ai-grow"></span>
    <span class="ai-demo" id="ai-demo"></span>
    <a class="ai-who" id="ai-who" href="AdminAccount"></a>
    <a class="ai-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ai-out" onclick="AdminInstructorsJs.signOut()">Sign out</button>
</header>
<aside class="ai-side" id="ai-nav" aria-label="Admin">
    <div class="ai-nav-top"><span>Menu</span><button type="button" class="ai-ibtn" aria-label="Close" onclick="AdminInstructorsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ai-amenu" id="ai-menu"></ul>
</aside>
<div class="ai-scrim" id="ai-scrim" onclick="AdminInstructorsJs.closeNav()"></div>
<main class="ai-amain" id="ai-main"><p class="ai-loading">Loading&hellip;</p></main>
<div class="ai-modal" id="ai-modal" onclick="if(event.target===this)AdminInstructorsJs.closeModal()">
    <div class="ai-mbox" role="dialog" aria-modal="true"><button type="button" class="ai-ibtn ai-mclose" aria-label="Close" onclick="AdminInstructorsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ai-mbody"></div></div>
</div>
<div class="ai-toast" id="ai-toast" role="status" aria-live="polite"></div>
</div>
