<div class="ap-site ap-admin" id="ap-site" data-theme="light" style="{plhd_style}">
<header class="ap-ahead">
    <button type="button" class="ap-ibtn ap-burger" aria-label="Menu" onclick="AdminPaymentsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ap-abrand" href="Admin"><svg class="ap-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--ap-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--ap-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="ap-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="ap-grow"></span>
    <span class="ap-demo" id="ap-demo"></span>
    <a class="ap-who" id="ap-who" href="AdminAccount"></a>
    <a class="ap-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ap-out" onclick="AdminPaymentsJs.signOut()">Sign out</button>
</header>
<aside class="ap-side" id="ap-nav" aria-label="Admin">
    <div class="ap-nav-top"><span>Menu</span><button type="button" class="ap-ibtn" aria-label="Close" onclick="AdminPaymentsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ap-amenu" id="ap-menu"></ul>
</aside>
<div class="ap-scrim" id="ap-scrim" onclick="AdminPaymentsJs.closeNav()"></div>
<main class="ap-amain" id="ap-main"><p class="ap-loading">Loading&hellip;</p></main>
<div class="ap-modal" id="ap-modal" onclick="if(event.target===this)AdminPaymentsJs.closeModal()">
    <div class="ap-mbox" role="dialog" aria-modal="true"><button type="button" class="ap-ibtn ap-mclose" aria-label="Close" onclick="AdminPaymentsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ap-mbody"></div></div>
</div>
<div class="ap-toast" id="ap-toast" role="status" aria-live="polite"></div>
</div>
