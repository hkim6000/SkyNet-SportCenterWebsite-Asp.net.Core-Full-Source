<div class="xg-site xg-admin" id="xg-site" data-theme="light" style="{plhd_style}">
<header class="xg-ahead">
    <button type="button" class="xg-ibtn xg-burger" aria-label="Menu" onclick="AdminMessagesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="xg-abrand" href="Admin"><svg class="xg-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--xg-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--xg-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="xg-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="xg-grow"></span>
    <span class="xg-demo" id="xg-demo"></span>
    <a class="xg-who" id="xg-who" href="AdminAccount"></a>
    <a class="xg-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="xg-out" onclick="AdminMessagesJs.signOut()">Sign out</button>
</header>
<aside class="xg-side" id="xg-nav" aria-label="Admin">
    <div class="xg-nav-top"><span>Menu</span><button type="button" class="xg-ibtn" aria-label="Close" onclick="AdminMessagesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="xg-amenu" id="xg-menu"></ul>
</aside>
<div class="xg-scrim" id="xg-scrim" onclick="AdminMessagesJs.closeNav()"></div>
<main class="xg-amain" id="xg-main"><p class="xg-loading">Loading&hellip;</p></main>
<div class="xg-modal" id="xg-modal" onclick="if(event.target===this)AdminMessagesJs.closeModal()">
    <div class="xg-mbox" role="dialog" aria-modal="true"><button type="button" class="xg-ibtn xg-mclose" aria-label="Close" onclick="AdminMessagesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="xg-mbody"></div></div>
</div>
<div class="xg-toast" id="xg-toast" role="status" aria-live="polite"></div>
</div>
