<div class="db-site db-admin" id="db-site" data-theme="light" style="{plhd_style}">
<header class="db-ahead">
    <button type="button" class="db-ibtn db-burger" aria-label="Menu" onclick="AdminJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="db-abrand" href="Admin"><svg class="db-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--db-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--db-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="db-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="db-grow"></span>
    <span class="db-demo" id="db-demo"></span>
    <a class="db-who" id="db-who" href="AdminAccount"></a>
    <a class="db-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="db-out" onclick="AdminJs.signOut()">Sign out</button>
</header>
<aside class="db-side" id="db-nav" aria-label="Admin">
    <div class="db-nav-top"><span>Menu</span><button type="button" class="db-ibtn" aria-label="Close" onclick="AdminJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="db-amenu" id="db-menu"></ul>
</aside>
<div class="db-scrim" id="db-scrim" onclick="AdminJs.closeNav()"></div>
<main class="db-amain" id="db-main"><p class="db-loading">Loading&hellip;</p></main>
<div class="db-modal" id="db-modal" onclick="if(event.target===this)AdminJs.closeModal()">
    <div class="db-mbox" role="dialog" aria-modal="true"><button type="button" class="db-ibtn db-mclose" aria-label="Close" onclick="AdminJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="db-mbody"></div></div>
</div>
<div class="db-toast" id="db-toast" role="status" aria-live="polite"></div>
</div>
