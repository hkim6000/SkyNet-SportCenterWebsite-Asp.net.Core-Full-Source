<div class="ar-site ar-admin" id="ar-site" data-theme="light" style="{plhd_style}">
<header class="ar-ahead">
    <button type="button" class="ar-ibtn ar-burger" aria-label="Menu" onclick="AdminRegistrationsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ar-abrand" href="Admin"><svg class="ar-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--ar-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--ar-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="ar-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="ar-grow"></span>
    <span class="ar-demo" id="ar-demo"></span>
    <a class="ar-who" id="ar-who" href="AdminAccount"></a>
    <a class="ar-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ar-out" onclick="AdminRegistrationsJs.signOut()">Sign out</button>
</header>
<aside class="ar-side" id="ar-nav" aria-label="Admin">
    <div class="ar-nav-top"><span>Menu</span><button type="button" class="ar-ibtn" aria-label="Close" onclick="AdminRegistrationsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="ar-amenu" id="ar-menu"></ul>
</aside>
<div class="ar-scrim" id="ar-scrim" onclick="AdminRegistrationsJs.closeNav()"></div>
<main class="ar-amain" id="ar-main"><p class="ar-loading">Loading&hellip;</p></main>
<div class="ar-modal" id="ar-modal" onclick="if(event.target===this)AdminRegistrationsJs.closeModal()">
    <div class="ar-mbox" role="dialog" aria-modal="true"><button type="button" class="ar-ibtn ar-mclose" aria-label="Close" onclick="AdminRegistrationsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ar-mbody"></div></div>
</div>
<div class="ar-toast" id="ar-toast" role="status" aria-live="polite"></div>
</div>
