<div class="as-site as-admin" id="as-site" data-theme="light" style="{plhd_style}">
<header class="as-ahead">
    <button type="button" class="as-ibtn as-burger" aria-label="Menu" onclick="AdminSportsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="as-abrand" href="Admin"><svg class="as-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--as-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--as-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="as-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="as-grow"></span>
    <span class="as-demo" id="as-demo"></span>
    <a class="as-who" id="as-who" href="AdminAccount"></a>
    <a class="as-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="as-out" onclick="AdminSportsJs.signOut()">Sign out</button>
</header>
<aside class="as-side" id="as-nav" aria-label="Admin">
    <div class="as-nav-top"><span>Menu</span><button type="button" class="as-ibtn" aria-label="Close" onclick="AdminSportsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="as-amenu" id="as-menu"></ul>
</aside>
<div class="as-scrim" id="as-scrim" onclick="AdminSportsJs.closeNav()"></div>
<main class="as-amain" id="as-main"><p class="as-loading">Loading&hellip;</p></main>
<div class="as-modal" id="as-modal" onclick="if(event.target===this)AdminSportsJs.closeModal()">
    <div class="as-mbox" role="dialog" aria-modal="true"><button type="button" class="as-ibtn as-mclose" aria-label="Close" onclick="AdminSportsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="as-mbody"></div></div>
</div>
<div class="as-toast" id="as-toast" role="status" aria-live="polite"></div>
</div>
