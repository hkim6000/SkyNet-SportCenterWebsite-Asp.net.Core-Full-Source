<div class="lg-site lg-login" id="lg-site" data-theme="light" style="{plhd_style}">
<img class="lg-lbg" src="images/sport/full/lobby.webp" alt="">
<main class="lg-main lg-lwrap">
    <div class="lg-lcard">
        <a class="lg-lbrand" href="Home"><svg class="lg-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--lg-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--lg-accent)" stroke-width="2" stroke-linecap="round"/></svg><b>{plhd_brand}</b><span>Admin</span></a>
        <h1>Staff sign in</h1>
        {plhd_demo}
        <form class="lg-lform" onsubmit="return AdminLoginJs.signIn()" novalidate>
            <label class="lg-field" for="lg-user"><span>User name</span><input type="text" id="lg-user" maxlength="40" autocomplete="username" autocapitalize="none" value="{plhd_user}"></label>
            <label class="lg-field" for="lg-pass"><span>Password</span><input type="password" id="lg-pass" maxlength="100" autocomplete="current-password" value="{plhd_pass}"></label>
            <em class="lg-err" id="lg-e-pass" role="alert"></em>
            <button type="submit" class="lg-btn lg-btn-accent lg-btn-wide" id="lg-lgo">Sign in</button>
        </form>
        <a class="lg-lback" href="Home">&larr; Back to the website</a>
    </div>
</main>
</div>
