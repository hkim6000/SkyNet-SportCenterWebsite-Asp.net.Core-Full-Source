<div class="am-site am-admin" id="am-site" data-theme="light" style="{plhd_style}">
<header class="am-ahead">
    <button type="button" class="am-ibtn am-burger" aria-label="Menu" onclick="AdminMembersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="am-abrand" href="Admin"><svg class="am-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0E2340"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--am-accent)" stroke-width="3.2"/><path d="M9.5 17.5c6 2.2 15 2.2 21 0M12.5 28.5c3-5.5 3-11.5 0-17M27.5 28.5c-3-5.5-3-11.5 0-17" fill="none" stroke="var(--am-accent)" stroke-width="2" stroke-linecap="round"/></svg><b id="am-bname">{plhd_name}</b><span>Admin</span></a>
    <span class="am-grow"></span>
    <span class="am-demo" id="am-demo"></span>
    <a class="am-who" id="am-who" href="AdminAccount"></a>
    <a class="am-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="am-out" onclick="AdminMembersJs.signOut()">Sign out</button>
</header>
<aside class="am-side" id="am-nav" aria-label="Admin">
    <div class="am-nav-top"><span>Menu</span><button type="button" class="am-ibtn" aria-label="Close" onclick="AdminMembersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="am-amenu" id="am-menu"></ul>
</aside>
<div class="am-scrim" id="am-scrim" onclick="AdminMembersJs.closeNav()"></div>
<main class="am-amain" id="am-main"><p class="am-loading">Loading&hellip;</p></main>
<div class="am-modal" id="am-modal" onclick="if(event.target===this)AdminMembersJs.closeModal()">
    <div class="am-mbox" role="dialog" aria-modal="true"><button type="button" class="am-ibtn am-mclose" aria-label="Close" onclick="AdminMembersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="am-mbody"></div></div>
</div>
<div class="am-toast" id="am-toast" role="status" aria-live="polite"></div>
</div>
